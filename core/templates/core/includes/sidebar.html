<aside class="col-lg-4 col-xl-3">
  <section class="mb-4">
    <h2 class="h4">Popular Tags</h2>
    <ul class="tag-cloud list-unstyled mb-0">
      {% for tag_name in sidebar.popular_tags %}
        <li><a href="{% url 'questions:tag' tag_name=tag_name %}"{% if forloop.counter <= 3 %} class="tag-l tag-hot"{% endif %}>{{ tag_name }}</a></li>
      {% empty %}
        <li class="text-body-secondary">Популярных тегов пока нет.</li>
      {% endfor %}
    </ul>
  </section>
  <section class="mb-4">
    <h2 class="h4">Best Members</h2>
    <ul class="list-unstyled best-members">
      {% for member in sidebar.best_members %}
        <li>{{ member }}</li>
      {% empty %}
        <li class="text-body-secondary">Пока нет активных участников.</li>
      {% endfor %}
    </ul>
  </section>
</aside>
