{% extends "core/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Регистрация</h1>
<div class="form-narrow">
  <form action="{% url 'core:signup' %}" method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "core/includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary px-4">Зарегистрироваться</button>
    <p class="mt-3 mb-0 small">Уже есть аккаунт? <a href="{% url 'core:login' %}">Войти</a></p>
  </form>
</div>
{% endblock %}
