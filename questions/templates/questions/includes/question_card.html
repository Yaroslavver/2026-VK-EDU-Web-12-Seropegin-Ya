{% load static %}
<article class="card question-card mb-3">
  <div class="card-body d-flex gap-3">
    <div class="card-side">
      <img src="{% static question.avatar %}" alt="{{ question.author }} avatar" class="avatar rounded">
      {% include "questions/includes/vote.html" with rating=question.rating state=question.vote %}
    </div>
    <div class="flex-grow-1 min-w-0">
      <h2 class="h5 mb-1"><a href="{% url 'questions:question' question_id=question.id %}" class="question-title">{{ question.title }}</a></h2>
      <p class="mb-2 text-clamp-2">{{ question.text }}</p>
      <div class="card-meta d-flex flex-wrap align-items-center gap-2 small">
        <a href="{% url 'questions:question' question_id=question.id %}#answers">answers ({{ question.answers_count }})</a>
        <span class="text-body-secondary">Tags:</span> {% include "questions/includes/tags.html" with tags=question.tags %}
        <time class="ms-auto text-body-secondary">{{ question.created }}</time>
      </div>
    </div>
  </div>
</article>
