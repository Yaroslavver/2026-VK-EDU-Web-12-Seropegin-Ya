{% extends "questions/layout.html" %}

{% block title %}Новый вопрос{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Новый вопрос</h1>
<div class="form-narrow">
  <form action="{% url 'questions:ask' %}" method="post" novalidate>
    {% csrf_token %}
    {% include "core/includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary fw-bold px-4">Опубликовать вопрос</button>
  </form>
</div>
{% endblock %}
