<aside class="col-lg-4 col-xl-3">
  <section class="mb-4">
    <h2 class="h4">Popular Tags</h2>
    <div class="tag-cloud">
      {% for tag in popular_tags %}
        <a href="{% url 'questions:tag' tag_name=tag.name %}" class="tag-{{ tag.size }}{% if tag.hot %} tag-hot{% endif %}">{{ tag.name }}</a>
      {% endfor %}
    </div>
  </section>
  <section class="mb-4">
    <h2 class="h4">Best Members</h2>
    <ul class="list-unstyled best-members">
      {% for member in best_members %}
        <li><a href="#">{{ member }}</a></li>
      {% endfor %}
    </ul>
  </section>
</aside>
