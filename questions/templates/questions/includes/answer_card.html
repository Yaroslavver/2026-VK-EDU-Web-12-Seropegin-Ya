{% load static %}
<article class="card answer-card mb-3{% if answer.is_correct %} answer-correct{% endif %}">
  <div class="card-body d-flex gap-3">
    <div class="card-side">
      <img src="{% static answer.avatar %}" alt="{{ answer.author }} avatar" class="avatar rounded">
      {% include "questions/includes/vote.html" with rating=answer.rating state=answer.vote %}
    </div>
    <div class="flex-grow-1 min-w-0">
      <p class="mb-2">{{ answer.text }}</p>
      <div class="d-flex flex-wrap align-items-center gap-2 small">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="correct-{{ answer.id }}"{% if answer.is_correct %} checked{% endif %}>
          <label class="form-check-label" for="correct-{{ answer.id }}">Correct!</label>
        </div>
        {% if answer.is_correct %}<span class="badge text-bg-success">Correct answer</span>{% endif %}
        <span class="text-body-secondary ms-auto"><a href="#">{{ answer.author }}</a> · <time>{{ answer.created }}</time></span>
      </div>
    </div>
  </div>
</article>
