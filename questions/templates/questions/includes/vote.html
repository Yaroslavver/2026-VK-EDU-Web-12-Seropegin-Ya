<form class="vote" action="{{ vote_url }}" method="post" data-vote-form
      data-state="{% if item.user_vote == 1 %}up{% elif item.user_vote == -1 %}down{% else %}none{% endif %}"
      {% if not user.is_authenticated %}title="Войдите, чтобы голосовать"{% endif %}>
  {% if user.is_authenticated %}{% csrf_token %}{% endif %}
  <button type="submit" name="value" value="1" class="btn vote-btn vote-up{% if item.user_vote == 1 %} active{% endif %}"
          aria-label="Лайк" aria-pressed="{% if item.user_vote == 1 %}true{% else %}false{% endif %}"{% if not user.is_authenticated %} disabled{% endif %}>&#9650;</button>
  <span class="vote-count" aria-live="polite">{{ item.rating }}</span>
  <button type="submit" name="value" value="-1" class="btn vote-btn vote-down{% if item.user_vote == -1 %} active{% endif %}"
          aria-label="Дизлайк" aria-pressed="{% if item.user_vote == -1 %}true{% else %}false{% endif %}"{% if not user.is_authenticated %} disabled{% endif %}>&#9660;</button>
</form>
