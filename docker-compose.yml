services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      RUNNING_IN_DOCKER: "True"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - .:/app
      - media:/app/media

  db:
    image: postgres:17
    env_file: .env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  media:
