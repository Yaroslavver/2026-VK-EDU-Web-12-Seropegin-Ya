{% extends "core/base.html" %}
{% load static %}
{% comment %}Общий шаблон страниц приложения questions: добавляет стили карточек и лайков.{% endcomment %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'questions/css/questions.css' %}">
{% endblock %}

{% block extra_js %}
  {% if user.is_authenticated %}
    <div class="alert alert-danger position-fixed bottom-0 end-0 m-3 z-3" role="alert" data-action-error hidden></div>
    <script src="{% static 'questions/js/actions.js' %}" defer></script>
  {% endif %}
{% endblock %}
